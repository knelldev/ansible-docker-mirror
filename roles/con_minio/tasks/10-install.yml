---
- name: "({{ task_filename }}) block for become=true"
  become: true
  block:
    - name: "({{ task_filename }}) Template {{ app_name }} files"
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '{{ item.mode | default("0644") }}'
      loop:
        - src: quadlet-minio.container.j2
          dest: "/etc/containers/systemd/minio.container"
        - src: ".env.j2"
          dest: "{{ app_path }}/.env"

    - name: "({{ task_filename }}) Template {{ app_name }} network"
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '{{ item.mode | default("0644") }}'
      loop:
        - src: quadlet-minio_default.network.j2
          dest: /etc/containers/systemd/{{ con_minio_container_network_name }}.network
      when: con_minio_container_network_create

    - name: "({{ task_filename }}) Create a symbolic links for container services"
      ansible.builtin.file:
        src: "/etc/containers/systemd/{{ item }}"
        dest: "{{ app_path }}/quadlet-{{ item }}"
        state: link
      loop:
        - "minio.container"
        - "minio_default.network"

    - name: "({{ task_filename }}) start {{ app_name }} quadlet"
      ansible.builtin.systemd_service:
        state: "{{ con_minio_systemd_service_state }}"
        daemon_reload: true
        name: minio

    - name: "({{ task_filename }}) Ensure Application is started and accepting connections"
      ansible.builtin.uri:
        url: "{{ con_minio_url }}"
        return_content: true
        status_code: 200, 403
        follow_redirects: all
        timeout: 5
        validate_certs: "{{ http.ssl_verify }}"
      register: healthcheck
      until: healthcheck.status is defined and (healthcheck.status == 200 or healthcheck.status == 403)
      retries: "{{ http.retries }}"
      delay: "{{ http.delay }}"
