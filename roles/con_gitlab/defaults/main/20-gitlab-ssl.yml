###############################################################################
# Default Values for Role - Might contain placeholders for passwords - NOT live
###############################################################################
---
con_gitlab_ssl_certs_write: false

con_gitlab_ssl_certs_dict:
  - path: "{{ app_path }}/config/ssl/example.com.key"
    content: |
      123
  - path: "{{ app_path }}/config/ssl/example.com.crt"
    content: |
      123

# LetsEncrypt configuration.
con_gitlab_letsencrypt_enable: false
con_gitlab_letsencrypt_contact_emails: ["gitlab@example.com"]
con_gitlab_letsencrypt_alt_names: []
con_gitlab_letsencrypt_auto_renew: true

# Certificate paths inside the container. Empty: GitLab's default /etc/gitlab/ssl/<host>.crt
con_gitlab_nginx_ssl_certificate: ""
con_gitlab_nginx_ssl_certificate_key: ""
