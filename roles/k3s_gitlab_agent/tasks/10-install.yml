---
# Derived values (replica count, image tag, per-agent names) are
# lazy expressions in vars/main.yml.
- name: K3s server block for {{ app_name }}
  become: true
  run_once: true
  block:
    - name: Add stable gitlab chart repo
      kubernetes.core.helm_repository:
        name: gitlab
        repo_url: "https://charts.gitlab.io"
        binary_path: "{{ k3s_gitlab_agent_helm_binary_path }}"

    # agentk should match the GitLab server version; an explicit tag wins.
    - name: Read GitLab server version
      ansible.builtin.uri:
        url: "{{ k3s_gitlab_agent_api_url }}/version"
        headers:
          PRIVATE-TOKEN: "{{ k3s_gitlab_agent_api_token }}"
        validate_certs: "{{ http.ssl_verify }}"
      register: k3s_gitlab_agent_server_version
      when: k3s_gitlab_agent_image_tag | length == 0
      no_log: true

    - name: Read schedulable Kubernetes nodes
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        kubeconfig: "{{ k3s_gitlab_agent_kubeconfig_path }}"
        validate_certs: "{{ http.ssl_verify }}"
      register: k3s_gitlab_agent_nodes

    - name: Register and deploy agents
      ansible.builtin.include_tasks: agent.yml
      loop: "{{ k3s_gitlab_agent_config_list }}"
      loop_control:
        loop_var: agent_item
        index_var: agent_index
        label: "{{ agent_item.name }}"

    - name: Show K3s GitLab agent cluster summary
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.template', 'summary-cluster.yaml.j2') | from_yaml }}"
