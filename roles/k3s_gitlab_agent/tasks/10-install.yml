---
- name: K3s server block for {{ app_name }}
  become: true
  run_once: true
  block:
    - name: Add stable gitlab chart repo
      kubernetes.core.helm_repository:
        name: gitlab
        repo_url: "https://charts.gitlab.io"
        binary_path: "{{ k3s_gitlab_agent_helm_binary_path }}"

    - name: Read schedulable Kubernetes nodes
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        kubeconfig: "{{ k3s_gitlab_agent_kubeconfig_path }}"
        validate_certs: "{{ http.ssl_verify }}"
      register: k3s_gitlab_agent_nodes

    - name: Count schedulable Kubernetes nodes
      ansible.builtin.set_fact:
        k3s_gitlab_agent_schedulable_node_count: >-
          {{
            k3s_gitlab_agent_nodes.resources | default([])
            | map(attribute='spec.unschedulable', default=false)
            | reject('equalto', true)
            | list | length
          }}

    - name: Calculate agentk replica count
      ansible.builtin.set_fact:
        k3s_gitlab_agent_replicas_effective: >-
          {{
            k3s_gitlab_agent_replicas | int
            if k3s_gitlab_agent_replicas is not none
            else (
              [
                [1, k3s_gitlab_agent_schedulable_node_count | int] | max,
                k3s_gitlab_agent_replicas_max | int
              ] | min
              if k3s_gitlab_agent_replicas_auto | bool
              else 1
            )
          }}

    - name: Initialize agent summary
      ansible.builtin.set_fact:
        k3s_gitlab_agent_summary_records: []

    - name: Register and deploy agents
      ansible.builtin.include_tasks: agent.yml
      loop: "{{ k3s_gitlab_agent_config_list }}"
      loop_control:
        loop_var: agent_item
        label: "{{ agent_item.name }}"

    - name: Show K3s GitLab agent deployment summary
      ansible.builtin.debug:
        msg:
          cluster:
            schedulable_nodes: "{{ k3s_gitlab_agent_schedulable_node_count }}"
            replicas: "{{ k3s_gitlab_agent_replicas_effective }}"
          chart_version: "{{ k3s_gitlab_agent_chart_version }}"
          image_tag: "{{ k3s_gitlab_agent_image_tag }}"
          kas_address: "{{ k3s_gitlab_agent_kas_address }}"
          rotation: "{{ k3s_gitlab_agent_rotate_token | bool }}"
          agents: "{{ k3s_gitlab_agent_summary_records }}"
