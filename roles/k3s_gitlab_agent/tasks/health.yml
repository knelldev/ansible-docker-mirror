---
# Wait until the agentk deployment of the current agent has rolled out
# with all replicas ready. On failure show pod state, events and logs (agentk
# reads its token from a file and does not log it), then fail.
- name: Check agentk rollout for {{ agent_item.name }}
  block:
    - name: Wait for ready agentk pods of {{ agent_item.name }}
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ k3s_gitlab_agent_item_namespace }}"
        label_selectors:
          - "{{ k3s_gitlab_agent_item_selector }}"
        kubeconfig: "{{ k3s_gitlab_agent_kubeconfig_path }}"
        validate_certs: "{{ http.ssl_verify }}"
      register: k3s_gitlab_agent_rollout
      until: k3s_gitlab_agent_rollout_ready | bool
      retries: "{{ k3s_gitlab_agent_health_check_retries }}"
      delay: "{{ k3s_gitlab_agent_health_check_delay }}"
      changed_when: false

  rescue:
    - name: Read agentk pods of {{ agent_item.name }}
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ k3s_gitlab_agent_item_namespace }}"
        label_selectors:
          - "{{ k3s_gitlab_agent_item_selector }}"
        kubeconfig: "{{ k3s_gitlab_agent_kubeconfig_path }}"
        validate_certs: "{{ http.ssl_verify }}"
      register: k3s_gitlab_agent_failed_pods
      failed_when: false

    - name: Read agentk pod logs of {{ agent_item.name }}
      kubernetes.core.k8s_log:
        name: "{{ item.metadata.name }}"
        namespace: "{{ k3s_gitlab_agent_item_namespace }}"
        tail_lines: "{{ k3s_gitlab_agent_failure_log_lines }}"
        kubeconfig: "{{ k3s_gitlab_agent_kubeconfig_path }}"
        validate_certs: "{{ http.ssl_verify }}"
      loop: "{{ k3s_gitlab_agent_failed_pods.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      register: k3s_gitlab_agent_failed_logs
      failed_when: false

    - name: Read agent namespace events of {{ agent_item.name }}
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Event
        namespace: "{{ k3s_gitlab_agent_item_namespace }}"
        kubeconfig: "{{ k3s_gitlab_agent_kubeconfig_path }}"
        validate_certs: "{{ http.ssl_verify }}"
      register: k3s_gitlab_agent_failed_events
      failed_when: false

    - name: Show agentk failure diagnostics of {{ agent_item.name }}
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.template', 'diagnostics.yaml.j2') | from_yaml }}"

    - name: Fail on unready agentk for {{ agent_item.name }}
      ansible.builtin.fail:
        msg: >-
          agentk {{ agent_item.name }} in {{ k3s_gitlab_agent_item_namespace }}
          did not become ready with {{ k3s_gitlab_agent_replicas_effective }}
          replicas. See the diagnostics above.
