<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Service unavailable</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f5f5f4;
        color: #1c1917;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1917;
          color: #e7e5e4;
        }
      }
      main {
        max-width: 32rem;
        padding: 1rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Service unavailable</h1>
      <p>This service is down or restarting. Please try again in a few minutes.</p>
    </main>
  </body>
</html>
