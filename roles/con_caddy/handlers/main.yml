---
- name: Restart caddy
  become: true
  ansible.builtin.systemd_service:
    name: caddy
    state: restarted
    daemon_reload: true
  when: con_caddy_systemd_service_state == 'started'

- name: Reload caddy
  become: true
  ansible.builtin.systemd_service:
    name: caddy
    state: reloaded
  when: con_caddy_systemd_service_state == 'started'
