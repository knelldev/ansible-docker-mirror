###############################################################################
# Default Values for Role - Might contain placeholders for passwords - NOT live
###############################################################################
---
# Settings from other roles
# Gitlab settings
con_gitlab_external_url: "http://example.com/" # noqa var-naming[no-role-prefix]
k3s_gitlab_runner_gitlab_external_url: "{{ con_gitlab_external_url }}"

# Kubernetes settings
k3s_gitlab_runner_namespace_create: true
k3s_gitlab_runner_namespace: "gitlab-runner"
k3s_gitlab_runner_kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# Runner settings
k3s_gitlab_runner_concurrent: 50
k3s_gitlab_runner_poll_timeout: 600

# Hook scripts (pre/post build resource monitoring)
# Set to false to disable hook scripts and hostpath volume mount
k3s_gitlab_runner_hooks_enabled: true

###############################################################################
# T-Shirt sized runners (auto-registered via GitLab API)
###############################################################################
# Requires: k3s_gitlab_runner_admin_token (GitLab admin API token, from vault)
# Requires: GitLab >= 17.0
# Sizes and limits are calculated automatically based on cluster resources.
# Size definitions are in vars/main.yml (not user-changeable).
k3s_gitlab_runner_tshirt_enabled: true
# k3s_gitlab_runner_admin_token: ""  # Required when tshirt_enabled or custom runners without token

# Resource calculation settings
k3s_gitlab_runner_system_reserved_mb: 2048  # Memory reserved for system/k3s
k3s_gitlab_runner_small_pool_pct: 50        # % of usable memory for xs/s/m (rest for l/xl/xxl)

# Optional: drain runners before update (wait for active jobs to finish)
k3s_gitlab_runner_drain_before_update: false

# Global force_reinstall flag - can be overridden per runner
k3s_gitlab_runner_force_reinstall: false

###############################################################################
# Custom runners
###############################################################################
# If token is omitted, the admin token is used to auto-register the runner.
# Each item supports:
#   name:          (required) Helm release name and runner name
#   token:         (optional) Runner token. If omitted, auto-registered via admin API
#   gitlab_url:    (optional) Override GitLab URL (default: k3s_gitlab_runner_gitlab_external_url)
#   concurrent:    (optional) Override max concurrent jobs (default: k3s_gitlab_runner_concurrent)
#   image:         (optional) Default container image (default: python:3)
#   poll_timeout:  (optional) Override poll timeout (default: k3s_gitlab_runner_poll_timeout)
#   privileged:    (optional) Run DinD jobs with privileged flag (default: false)
#   cache:         (optional) S3 cache configuration
#     server:      S3 endpoint (e.g. "minio.example.com:9000")
#     access_key:  S3 access key
#     secret_key:  S3 secret key
#     bucket:      Bucket name (e.g. "gitlab-runner-cache")
#     insecure:    (optional) Use HTTP instead of HTTPS (default: true)
#   extra_config:  (optional) Additional TOML config appended at [[runners]] level
#                  Use this for cpu/memory limits, node selectors, tolerations, etc.
#   runner_type:   (optional) "instance_type" (default), "group_type", or "project_type"
#   group_id:      (optional) GitLab group ID (required when runner_type is "group_type")
#   project_id:    (optional) GitLab project ID (required when runner_type is "project_type")
#   tags:          (optional) Comma-separated tags for the runner
#   description:   (optional) Runner description shown in GitLab UI
#   skip_healthcheck: (optional) Skip the health check after deployment (default: false)
#   force_reinstall: (optional) Force Helm chart reinstall/update (default: false)
k3s_gitlab_runner_config_list: []
# Example: Runner with manual token
# - name: my-runner
#   token: glrt-xxxxxxxxxxxx
#   image: python:3
#   concurrent: 10
#   cache:
#     server: "minio.example.com:9000"
#     access_key: "ACCESS_KEY"
#     secret_key: "SECRET_KEY"
#     bucket: "gitlab-runner-cache"
#     insecure: true
#   extra_config: |
#     [runners.kubernetes]
#       cpu_request = "2"
#       memory_request = "2Gi"
#       memory_limit = "4Gi"
#       node_selector_overwrite_allowed = ".*"
#     [runners.kubernetes.node_selector]
#       "kubernetes.io/os" = "linux"
#
# Example: Auto-registered instance runner (uses admin token)
# - name: auto-runner
#   description: "Auto-registered shared runner"
#   tags: "docker,k8s,shared"
#
# Example: Group-scoped runner
# - name: group-runner
#   runner_type: group_type
#   group_id: 42
#   tags: "group-ci"
#
# Example: Custom runner with manual token (no admin token needed)
# - name: custom-runner
#   token: glrt-xxxxxxxxxxxx
#   skip_healthcheck: true  # Skip health check if no admin token available
