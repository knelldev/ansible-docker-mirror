---
app_name: "{{ role_name.split('_')[1:] | join('_') }}" # noqa var-naming[no-role-prefix]
app_path: "{{ storage_base_path }}/{{ app_name }}" # noqa var-naming[no-role-prefix]

# T-Shirt size definitions (not user-changeable)
# mem_request = mem_limit for guaranteed QoS
# Tags are auto-generated as: docker-{size},k8s-{size},shared-{size}
# min_node_mb: minimum node memory required to enable this size (0 = always)
k3s_gitlab_runner_tshirt_sizes:
  xs:
    memory_limit: "512Mi"
    memory_limit_mb: 512
    cpu_request: "250m"
    min_node_mb: 0
  s:
    memory_limit: "1Gi"
    memory_limit_mb: 1024
    cpu_request: "500m"
    min_node_mb: 0
  m:
    memory_limit: "2Gi"
    memory_limit_mb: 2048
    cpu_request: "1"
    min_node_mb: 0
  l:
    memory_limit: "4Gi"
    memory_limit_mb: 4096
    cpu_request: "2"
    min_node_mb: 0
  xl:
    memory_limit: "8Gi"
    memory_limit_mb: 8192
    cpu_request: "4"
    min_node_mb: 24576
  xxl:
    memory_limit: "16Gi"
    memory_limit_mb: 16384
    cpu_request: "8"
    min_node_mb: 32768

# Minimum GitLab version required for runner auto-registration API
k3s_gitlab_runner_min_gitlab_version: "17.0"
