---
- name: "k3s server block"
  become: true
  run_once: true
  block:
    - name: "(register) check GitLab version"
      ansible.builtin.uri:
        url: "{{ k3s_gitlab_runner_gitlab_external_url }}/api/v4/version"
        headers:
          PRIVATE-TOKEN: "{{ k3s_gitlab_runner_admin_token }}"
        validate_certs: "{{ http.ssl_verify }}"
      register: k3s_gitlab_runner_gitlab_version_result
      run_once: true
      when: k3s_gitlab_runner_admin_token is defined

    - name: "(register) fail if GitLab < 17.0"
      ansible.builtin.fail:
        msg: >-
          GitLab version {{ k3s_gitlab_runner_gitlab_version_result.json.version }} is below
          {{ k3s_gitlab_runner_min_gitlab_version }}. Runner auto-registration requires >= 17.0.
      when:
        - k3s_gitlab_runner_gitlab_version_result.json.version is version(k3s_gitlab_runner_min_gitlab_version, '<')

    - name: Add stable gitlab chart repo
      kubernetes.core.helm_repository:
        name: gitlab
        repo_url: "https://charts.gitlab.io"
        binary_path: /usr/local/bin/helm

    # --- T-Shirt runners ---
    - name: "register and deploy t-shirt runners"
      ansible.builtin.include_tasks: register.yml
      loop: "{{ k3s_gitlab_runner_tshirt_sizes | dict2items }}"
      loop_control:
        loop_var: tshirt_item
      when:
        - k3s_gitlab_runner_tshirt_enabled
        - (ansible_play_hosts | map('extract', hostvars, 'ansible_memtotal_mb') | min | int) >= (tshirt_item.value.min_node_mb | int) or (tshirt_item.value.min_node_mb | int) == 0

    # --- Custom runners ---
    - name: "deploy custom runners"
      kubernetes.core.helm:
        name: "{{ item.name }}"
        chart_ref: gitlab/gitlab-runner
        namespace: "{{ k3s_gitlab_runner_namespace | lower }}"
        update_repo_cache: true
        values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"
        kubeconfig: "{{ k3s_gitlab_runner_kubeconfig_path }}"
        binary_path: /usr/local/bin/helm
        validate_certs: "{{ http.ssl_verify }}"
      loop: "{{ k3s_gitlab_runner_config_list }}"
      when: k3s_gitlab_runner_config_list | length > 0
