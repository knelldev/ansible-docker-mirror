---
- name: "({{ task_filename }}) k3s server block"
  become: true
  block:
    - name: Add stable gitlab chart repo
      kubernetes.core.helm_repository:
        name: gitlab
        repo_url: "https://charts.gitlab.io"
        binary_path: /usr/local/bin/helm

    - name: Deploy gitlab-runner with values
      kubernetes.core.helm:
        name: gitlab-runner
        chart_ref: gitlab/gitlab-runner
        namespace: "{{ k3s_gitlab_runner_namespace | lower }}"
        update_repo_cache: true
        values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"
        kubeconfig: "{{ k3s_gitlab_runner_kubeconfig_path }}"
        binary_path: /usr/local/bin/helm
