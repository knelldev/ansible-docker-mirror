---
# Shared by every role that stores files on the host; keep it identical.
# Role-specific directories go into <role>_dir_extra (defaults), other
# prerequisites and checks into a later numbered task file.
- name: Prepare account and storage for {{ app_name }}
  become: true
  block:
    - name: Create user and group for {{ app_name }}
      when: app_user_create | bool
      block:
        - name: Create group for {{ app_name }}
          ansible.builtin.group:
            name: "{{ app_group }}"
            system: true
            state: present

        - name: Create user for {{ app_name }}
          ansible.builtin.user:
            name: "{{ app_user }}"
            group: "{{ app_group }}"
            system: true
            create_home: false
            state: present

    - name: Create storage directories for {{ app_name }}
      ansible.builtin.file:
        path: "{{ (app_path + '/' + item.name) | regex_replace('/$', '') }}"
        state: directory
        owner: "{{ item.owner | default(app_user if app_user_create | bool else 'root') }}"
        group: "{{ item.group | default(app_group if app_user_create | bool else storage_group) }}"
        mode: "{{ item.mode | default('0700') }}"
        recurse: "{{ item.recurse | default(false) }}"
      loop: "{{ [{'name': ''}] + app_dir_extra }}"
      loop_control:
        label: "{{ item.name }}"
