---
- name: "customize block"
  become: true
  block:
    - name: "ensure scripts directory exists"
      ansible.builtin.file:
        path: "{{ app_path }}/scripts"
        state: directory
        mode: "0755"

    - name: "deploy pre-build hook script"
      ansible.builtin.template:
        src: pre-build.sh.j2
        dest: "{{ app_path }}/scripts/pre-build.sh"
        mode: "0755"

    - name: "deploy post-build hook script"
      ansible.builtin.template:
        src: post-build.sh.j2
        dest: "{{ app_path }}/scripts/post-build.sh"
        mode: "0755"
