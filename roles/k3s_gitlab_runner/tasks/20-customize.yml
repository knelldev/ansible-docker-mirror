---
- name: "customize block"
  become: true
  block:
    - name: "ensure scripts directory exists"
      ansible.builtin.file:
        path: /data/gitlab-runner/scripts
        state: directory
        mode: "0755"

    - name: "deploy pre-build hook script"
      ansible.builtin.template:
        src: pre-build.sh.j2
        dest: /data/gitlab-runner/scripts/pre-build.sh
        mode: "0755"

    - name: "deploy post-build hook script"
      ansible.builtin.template:
        src: post-build.sh.j2
        dest: /data/gitlab-runner/scripts/post-build.sh
        mode: "0755"
