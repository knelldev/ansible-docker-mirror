---
# Runner registration and deployment
# runner_item is the loop var: either tshirt_item {key, value} or config_item from k3s_gitlab_runner_config_list

- name: "(register) check if {{ runner_item.key | default(runner_item.name) }} exists"
  ansible.builtin.uri:
    url: "{% if runner_item.group_id is defined %}{{ k3s_gitlab_runner_gitlab_external_url }}/api/v4/groups/{{ runner_item.group_id }}/runners{% elif runner_item.project_id is defined %}{{ k3s_gitlab_runner_gitlab_external_url }}/api/v4/projects/{{ runner_item.project_id }}/runners{% else %}{{ k3s_gitlab_runner_gitlab_external_url }}/api/v4/user/runners{% endif %}?search={{ runner_item.key | default(runner_item.name) }}"
    headers:
      PRIVATE-TOKEN: "{{ runner_item.token | default(k3s_gitlab_runner_admin_token) }}"
    validate_certs: "{{ http.ssl_verify }}"
  register: k3s_gitlab_runner_existing
  when: (runner_item.token is defined) or (k3s_gitlab_runner_admin_token is defined)

- name: "(register) create {{ runner_item.key | default(runner_item.name) }} via API"
  ansible.builtin.uri:
    url: "{% if runner_item.group_id is defined %}{{ k3s_gitlab_runner_gitlab_external_url }}/api/v4/groups/{{ runner_item.group_id }}/runners{% elif runner_item.project_id is defined %}{{ k3s_gitlab_runner_gitlab_external_url }}/api/v4/projects/{{ runner_item.project_id }}/runners{% else %}{{ k3s_gitlab_runner_gitlab_external_url }}/api/v4/user/runners{% endif %}"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ runner_item.token | default(k3s_gitlab_runner_admin_token) }}"
    body_format: json
    body: "{{ lookup('template', 'register-body.json.j2') | from_json }}"
    validate_certs: "{{ http.ssl_verify }}"
    status_code: 201
  register: k3s_gitlab_runner_created
  when:
    - (runner_item.token is defined) or (k3s_gitlab_runner_admin_token is defined)
    - ((k3s_gitlab_runner_existing.json | default([])) | selectattr('description', 'search', runner_item.key | default(runner_item.name)) | list | length) == 0

- name: "(register) rotate token for existing {{ runner_item.key | default(runner_item.name) }}"
  ansible.builtin.uri:
    url: "{{ k3s_gitlab_runner_gitlab_external_url }}/api/v4/runners/{{ (k3s_gitlab_runner_existing.json | default([]) | selectattr('description', 'search', runner_item.key | default(runner_item.name)) | first).id }}/reset_authentication_token"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ runner_item.token | default(k3s_gitlab_runner_admin_token) }}"
    validate_certs: "{{ http.ssl_verify }}"
    status_code: 200
  register: k3s_gitlab_runner_rotated
  when:
    - (runner_item.token is defined) or (k3s_gitlab_runner_admin_token is defined)
    - ((k3s_gitlab_runner_existing.json | default([])) | selectattr('description', 'search', runner_item.key | default(runner_item.name)) | list | length) > 0
    - (runner_item.sizing_changed | default(k3s_gitlab_runner_sizing_changed) | default(true)) | bool

- name: "(register) deploy helm chart for {{ runner_item.key | default(runner_item.name) }}"
  kubernetes.core.helm:
    name: "{{ runner_item.key | default(runner_item.name) }}"
    chart_ref: gitlab/gitlab-runner
    namespace: "{{ k3s_gitlab_runner_namespace | lower }}"
    update_repo_cache: true
    values: "{{ lookup('template', ('values-tshirt.yaml.j2' if runner_item.key is defined else 'values.yaml.j2')) | from_yaml }}"
    kubeconfig: "{{ k3s_gitlab_runner_kubeconfig_path }}"
    binary_path: /usr/local/bin/helm
    validate_certs: "{{ http.ssl_verify }}"
    force: "{{ runner_item.force_reinstall | default(k3s_gitlab_runner_force_reinstall) }}"
  when: runner_item.token is defined or (runner_item.key is defined and runner_item.value is defined) or (runner_item.runner_type is defined)

- name: "(healthcheck) verify {{ runner_item.key | default(runner_item.name) }} is registered"
  ansible.builtin.uri:
    url: "{{ k3s_gitlab_runner_gitlab_external_url }}/api/v4/runners/{{ (k3s_gitlab_runner_existing.json | default([]) | selectattr('description', 'search', runner_item.key | default(runner_item.name)) | first).id }}"
    headers:
      PRIVATE-TOKEN: "{{ runner_item.token | default(k3s_gitlab_runner_admin_token) }}"
    validate_certs: "{{ http.ssl_verify }}"
  register: k3s_gitlab_runner_verify
  when:
    - (runner_item.token is defined) or (k3s_gitlab_runner_admin_token is defined)
    - runner_item.skip_healthcheck | default(false) == false
    - ((k3s_gitlab_runner_existing.json | default([])) | selectattr('description', 'search', runner_item.key | default(runner_item.name)) | list | length) > 0
