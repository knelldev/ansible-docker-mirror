---
- name: Create a new group
  ansible.builtin.win_group:
    name: docker-users
    description: docker-users group
    state: present

# - name: Add a local and domain user to a local group
#   win_group_membership:
#     name: docker-users
#     members: '{{ item.domain }}\{{ item.user }}'
#     state: present
#   loop: "{{ win_docker_users }}"

- name: Template docker daemon.json
  ansible.builtin.win_template:
    src: "daemon.json.j2"
    dest: 'C:\ProgramData\docker\config\daemon.json'

- name: Restart docker servioce
  ansible.builtin.win_service:
    name: docker
    state: restarted

# - name: Add docker-users to docker_engine pipe ACL
#   ansible.windows.win_acl:
#     path: //./pipe/docker_engine
#     user: docker-users
#     rights: FullControl
#     type: allow
#     state: present

- name: Add docker-users to docker_engine pipe ACL
  ansible.windows.win_powershell:
    # Static script; waits for the busy docker_engine pipe, then adds the ACL.
    script: "{{ lookup('ansible.builtin.file', 'docker-pipe-acl.ps1') }}"
    executable: pwsh
  when: win_docker_pipe_group_acl
