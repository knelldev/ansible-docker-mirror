---
- name: Block for become=true
  become: true
  when: os_container_auto_update
  block:
    - name: Create override dir for podman-auto-update
      ansible.builtin.file:
        path: /etc/systemd/system/podman-auto-update.timer.d/
        state: directory
        mode: "0755"
      when: os_container_auto_update

    - name: Configure podman-auto-update
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '{{ item.mode | default("0644") }}'
      loop:
        - src: podman-auto-update.timer.j2
          dest: /etc/systemd/system/podman-auto-update.timer.d/override.conf
          mode: "0600"

    - name: Start {{ app_name }}-certbot quadlet
      ansible.builtin.systemd_service:
        state: "{{ os_container_auto_systemd_state }}"
        daemon_reload: true
        enabled: "{{ os_container_auto_systemd_enabled }}"
        name: podman-auto-update.timer
