---
- name: Block for become=true
  become: true
  block:
    - name: Ensure epel-release is installed
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Ensure podman is installed
      ansible.builtin.dnf:
        name:
          - podman
          - podman-docker
          - podman-compose
        state: present

    - name: Replace graphroot path in configuration file
      ansible.builtin.lineinfile:
        path: /etc/containers/storage.conf
        regexp: '^graphroot\s*=\s*'
        line: 'graphroot = "{{ os_container_data_root }}"'
      register: graphroot_lineinfile

    - name: Restart podman service
      ansible.builtin.service:
        state: restarted
        enabled: true
        name: podman

    - name: Apply SELinux context recursively to Podman storage 1/2 # noqa no-changed-value
      ansible.builtin.command: semanage fcontext -a -e /var/lib/containers/storage {{ os_container_data_root }}
      when: graphroot_lineinfile.changed

    - name: Apply SELinux context recursively to Podman storage 2/2 # noqa no-changed-value
      ansible.builtin.command: restorecon -R -v {{ os_container_data_root }}
      when: graphroot_lineinfile.changed
