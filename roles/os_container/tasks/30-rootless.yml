---
# Each setting also reverts when its switch is turned off.
- name: Rootless Podman settings
  become: true
  block:
    - name: Set or remove subordinate ID range for new users
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^#?\s*{{ item.key }}\s'
        line: "{{ item.key }}\t{{ item.value }}"
        state: "{{ 'present' if os_container_rootless | bool else 'absent' }}"
      loop: "{{ os_container_login_defs | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Create containers.conf.d dir
      ansible.builtin.file:
        path: /etc/containers/containers.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write Podman drop-in of {{ role_name }}
      ansible.builtin.template:
        src: containers.conf.j2
        dest: /etc/containers/containers.conf.d/50-os-container.conf
        owner: root
        group: root
        mode: "0644"
      when: os_container_netns_host | bool

    - name: Remove empty or old Podman drop-ins
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ ['/etc/containers/containers.conf.d/50-netns.conf'] + ([] if os_container_netns_host | bool else ['/etc/containers/containers.conf.d/50-os-container.conf']) }}"

    # A oneshot unit instead of /etc/sysctl.d: systemd-sysctl.service skips
    # read-only /proc/sys, as in LXC containers, where only /proc/sys/net is
    # writable. The unit works on VMs as well.
    - name: Install unprivileged-port-start unit
      ansible.builtin.template:
        src: systemd-unit.j2
        dest: "{{ item.path }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - "{{ os_container_systemd_units.unprivileged_port_start }}"
      loop_control:
        label: "{{ item.path }}"
      register: os_container_port_unit
      when: os_container_unprivileged_port_start is not none

    - name: Enable and apply unprivileged-port-start unit
      ansible.builtin.systemd_service:
        name: unprivileged-port-start.service
        enabled: true
        state: "{{ 'restarted' if os_container_port_unit.changed else 'started' }}"
        daemon_reload: true
      when: os_container_unprivileged_port_start is not none

    - name: Revert unprivileged port start
      when: os_container_unprivileged_port_start is none
      block:
        - name: Check for unprivileged-port-start unit
          ansible.builtin.stat:
            path: "{{ os_container_systemd_units.unprivileged_port_start.path }}"
          register: os_container_port_unit_file

        - name: Disable unprivileged-port-start unit
          ansible.builtin.systemd_service:
            name: unprivileged-port-start.service
            enabled: false
            state: stopped
          when: os_container_port_unit_file.stat.exists

        - name: Remove unprivileged-port-start unit
          ansible.builtin.file:
            path: "{{ os_container_systemd_units.unprivileged_port_start.path }}"
            state: absent

        - name: Reload systemd after removing the unit
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: os_container_port_unit_file.stat.exists

        - name: Read unprivileged port start
          ansible.builtin.slurp:
            src: /proc/sys/net/ipv4/ip_unprivileged_port_start
          register: os_container_port_start_now

        - name: Set unprivileged port start back to 1024
          ansible.builtin.command: /usr/sbin/sysctl -w net.ipv4.ip_unprivileged_port_start=1024
          when: os_container_port_start_now.content | b64decode | trim != '1024'
          changed_when: true
