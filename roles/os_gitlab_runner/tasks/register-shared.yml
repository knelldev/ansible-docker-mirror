---
- name: reset and grab token
  uri:
    url: "{{ gitlab_url }}/api/v4/runners/reset_registration_token"
    method: POST
    validate_certs: no
    status_code: 200,201
    body_format: json
    headers:
        Content-Type: application/json
        Authorization: "Bearer {{ gitlab_admin_access_token.json.access_token }}"
  register: gitlab_shared_token

- name: register shared gitlab runner
  shell: |
    gitlab-runner register \
    --non-interactive \
    --url "{{ runner_item.url }}" \
    --name "{{ runner_item.runner_name }}" \
    --registration-token '{{ gitlab_shared_token.json.token }}' \
    --executor "{{ runner_item.executor }}" \
    --docker-image "{{runner_item.docker_image | default("alpine:latest") }}" \
    --maintenance-note "Ansible installed runner" \
    --tag-list "{{ runner_item.tags }}" \
    --run-untagged="{{ runner_item.run_untagged }}" \
    --locked="{{ runner_item.locked }}" \
    --access-level="{{ runner_item.protected }}"
  register: shared_result
  retries: 10
  delay: 5
  until: shared_result.rc == 0
