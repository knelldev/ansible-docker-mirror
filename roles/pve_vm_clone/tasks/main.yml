##############################################################################
# Standard Role Entrypoint (main.yml)
#
# This file serves as a standardized entrypoint for our Ansible roles.
# Its purpose is to provide a consistent, ordered execution flow without
# needing to modify this file for each role.
#
# --- How It Works ---
#
# 1. OS-Specific Variables:
#    It first attempts to load variables from the `vars/` directory based on
#    the target operating system, allowing for OS-specific overrides.
#
# 2. Automatic Task Inclusion:
#    It automatically finds and includes task files from the `tasks/`
#    directory that are prefixed with two digits (e.g., `10-install.yml`,
#    `20-configure.yml`). These files are executed in ascending order.
#
# 3. Manual Task Inclusion:
#    Task files that do NOT start with a two-digit prefix (e.g., `_helpers.yml`)
#    are ignored by the automatic loop. This is useful for files that you
#    want to include manually inside another task, for example, within a
#    `block` or a `loop`.
#
# 4. Logging:
#    The filename of each included task is passed as the `task_filename`
#    variable, which can be used in task names for clearer logging output.
#    Example: `name: "({{ task_filename }}) Install packages"`
#
##############################################################################
---
# Load variables for the target OS, if a matching file exists.
- name: (main.yml) Load OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution | lower }}-{{ ansible_distribution_version | lower }}.yml" # e.g., ubuntu-22.04.yml
        - "{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version | lower }}.yml" # e.g., ubuntu-22.yml
        - "{{ ansible_distribution | lower }}.yml" # e.g., ubuntu.yml
        - "{{ ansible_os_family | lower }}.yml" # e.g., debian.yml
      skip: true

# Include all task files prefixed with two digits in ascending order.
- name: (main.yml) Include ordered tasks
  ansible.builtin.include_tasks: "{{ task_file }}"
  loop: "{{ query('fileglob', 'tasks/[0-9][0-9]*.yml') | sort }}"
  loop_control:
    loop_var: task_file
  vars:
    task_filename: "{{ task_file | basename }}"
