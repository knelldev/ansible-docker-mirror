---
# One server, or an odd number (3/5/7) with embedded etcd. The first server
# of the play installs first (--cluster-init when more servers are planned);
# the others join it with its URL and token.
- name: Warn about an even number of servers
  ansible.builtin.debug:
    msg: >-
      {{ os_k3s_server_hosts | length }} K3s servers planned. An even count is
      not recommended: embedded etcd loses quorum when one fails. Use 1, 3, 5
      or 7.
  run_once: true
  when: os_k3s_server_hosts | length is even

- name: Execute get-k3s.sh
  ansible.builtin.command: '/tmp/get-k3s.sh {% if os_k3s_node_external_ip_override %}--node-external-ip={{ os_k3s_node_external_ip }}{% endif %} --data-dir={{ app_path }} --kubelet-arg "--root-dir={{ app_path }}/kubelet" {{ os_k3s_server_additional_parameters }}{{ " --cluster-init" if os_k3s_server_hosts | length > 1 else "" }}'
  environment:
    K3S_NODE_NAME: "{{ ansible_hostname }}"
    INSTALL_K3S_EXEC: "server"
    INSTALL_K3S_CHANNEL: "{{ os_k3s_channel }}"
  changed_when: true
  when: inventory_hostname == os_k3s_server_hosts | first

# URL and token come from the first server only, so no server overwrites them.
- name: Token block
  when: inventory_hostname == os_k3s_server_hosts | first
  block:
    - name: Read token
      ansible.builtin.slurp:
        src: "{{ app_path }}/server/node-token"
      become: true
      register: os_k3s_token_file

    - name: Set token as fact
      ansible.builtin.set_fact:
        os_k3s_node_token: "{{ os_k3s_token_file['content'] | b64decode | trim }}"
      delegate_to: localhost
      delegate_facts: true

    - name: Set token as fact
      ansible.builtin.set_fact:
        os_k3s_url: "https://{{ ansible_fqdn }}:6443"
      delegate_to: localhost
      delegate_facts: true

    - name: Show os_k3s_url
      ansible.builtin.debug:
        msg: "K3s URL: {{ hostvars['localhost']['os_k3s_url'] }}"

- name: Execute get-k3s.sh (joining server)
  ansible.builtin.command: '/tmp/get-k3s.sh {% if os_k3s_node_external_ip_override %}--node-external-ip={{ os_k3s_node_external_ip }}{% endif %} --data-dir={{ app_path }} --kubelet-arg "--root-dir={{ app_path }}/kubelet" {{ os_k3s_server_additional_parameters }}'
  environment:
    K3S_URL: "{{ hostvars['localhost']['os_k3s_url'] }}"
    K3S_TOKEN: "{{ hostvars['localhost']['os_k3s_node_token'] }}"
    K3S_NODE_NAME: "{{ ansible_hostname }}"
    INSTALL_K3S_EXEC: "server"
    INSTALL_K3S_CHANNEL: "{{ os_k3s_channel }}"
  changed_when: true
  when: inventory_hostname != os_k3s_server_hosts | first

- name: Disable schedule on server
  ansible.builtin.command: "kubectl taint nodes {{ ansible_hostname }} node-role.kubernetes.io/master:NoSchedule --overwrite --kubeconfig /etc/rancher/k3s/k3s.yaml"
  changed_when: true
  when: not os_k3s_server_allow_schedule

- name: Create .kube in home
  ansible.builtin.file:
    path: "~/.kube"
    state: directory
    mode: "0644"

- name: Copy k3s config to executing user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: ~/.kube/config
    remote_src: true
    mode: "0644"
