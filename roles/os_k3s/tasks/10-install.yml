---
- name: Block for become=true
  when: os_k3s_install
  become: true
  block:
    - name: Download get-k3s.sh
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/get-k3s.sh
        mode: "0700"

    - name: Install k3s Server (Controller)
      become: true
      when: os_k3s_server
      block:
        - name: Include k3s Agent (Controller)
          ansible.builtin.include_tasks: k3s-server.yml

    - name: Install k3s Agent (Worker)
      become: true
      when: not os_k3s_server
      block:
        - name: Include k3s Agent (Worker)
          ansible.builtin.include_tasks: k3s-agent.yml

    - name: Remove get-k3s.sh
      ansible.builtin.file:
        path: /tmp/get-k3s.sh
        state: absent
