###############################################################################
# Default Values for Role - Might contain placeholders for passwords - NOT live
# Switchable parts. Defaults keep re-runs on existing hosts unchanged.
###############################################################################
---
# dnf-automatic (daily timer from 20-configure.yml). Default: check and
# report in motd only, as existing hosts did before (their old config put
# apply_updates, download_updates and reboot in sections dnf 4 ignores).
os_prepare_dnf_automatic_upgrade_type: default # default | security | ...
os_prepare_dnf_automatic_apply_updates: false
os_prepare_dnf_automatic_reboot: never # dnf 4: never | when-changed | when-needed

# Group that owns storage_base_path
os_prepare_data_group: "{{ storage_group }}"

# Local admin user: SSH key only, locked password, passwordless sudo
os_prepare_admin_enabled: false
os_prepare_admin_user: localadmin
os_prepare_admin_pubkeys: [] # list of public key strings

# First-boot unit: new machine-id and SSH host keys once per clone
os_prepare_firstboot_enabled: false

# node_exporter from EPEL with extra arguments (systemd drop-in)
os_prepare_node_exporter_enabled: false
os_prepare_node_exporter_package: node-exporter
os_prepare_node_exporter_service: node_exporter
os_prepare_node_exporter_binary: /usr/bin/node_exporter
os_prepare_node_exporter_args: --collector.systemd

# Weekly full update as a second dnf-automatic unit, after the Thu 02:00 PBS
# backup. Reboot `never` by default, so re-runs on existing hosts cause no
# surprise reboots; the template playbook sets `when-needed`.
os_prepare_weekly_update_enabled: true
os_prepare_weekly_update_oncalendar: Thu *-*-* 04:00:00
os_prepare_weekly_update_upgrade_type: default
os_prepare_weekly_update_reboot: never

# nftables allowlist (DRAFT, tasks/80-firewall.yml is a TODO): input policy
# drop; SSH only from os_prepare_firewall_ssh_allow. The part must refuse an
# empty allowlist and apply rules with a timed rollback.
os_prepare_firewall_enabled: false
os_prepare_firewall_ssh_port: 22
os_prepare_firewall_ssh_allow: [] # source CIDRs, IPv4 or IPv6
