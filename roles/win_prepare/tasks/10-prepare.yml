---
- name: "({{ task_filename }}) Create data directory"
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ win_storage_base_path }}"
    - '{{ win_storage_base_path }}\ansible'
    - '{{ win_storage_base_path }}\tools'

- name: "({{ task_filename }}) Install all security, critical, and rollup updates without a scheduled task"
  ansible.windows.win_updates:
    category_names:
      - SecurityUpdates
      - CriticalUpdates
      - UpdateRollups
  register: win_os_update_status
  when: win_os_update

- name: "({{ task_filename }}) Install or Upgrade installed choco packages"
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ item.name }}"
    state: "{{ item.state | default('latest') }}"
    version: "{{ item.version | default('') }}"
    package_params: "{% if item.install_dir is defined %}{{ item.install_dir }}{% else %}/INSTALLDIR={{ win_storage_base_path }}\\tools\\{{ item.name }}{% endif %} {{ item.params | default('') }}"
  loop: "{{ win_package_list }}"
  when: win_package_list is defined

- name: "({{ task_filename }}) Install Microsoft Subsystem for Linux"
  ansible.windows.win_optional_feature:
    name: Microsoft-Windows-Subsystem-Linux
    state: present
  register: wsl_status

- name: "({{ task_filename }}) Reboot if neccessary"
  ansible.windows.win_reboot:
  when: wsl_status.reboot_required or win_os_update_status.reboot_required
