---
- name: Block for become=true
  become: true
  block:
    - name: Template gitlab files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '{{ item.mode | default("0644") }}'
      loop:
        - src: docker-compose.yml.j2
          dest: "{{ con_watchtower_path }}/docker-compose.yml"

    - name: Create and start watchtower
      ansible.builtin.shell: docker compose up -d --force-recreate
      args:
        chdir: "{{ con_watchtower_path }}"
