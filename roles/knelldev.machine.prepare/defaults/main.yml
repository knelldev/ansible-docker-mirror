machine_apt_list:
  - python3
  - python3-apt
  - python3-pip
  - nano
  - htop
  # - qemu-guest-agent - if vm
  - cron-apt
  - sudo
  - rsync
  - git

machine_pip_list:
  - docker

machine_aliases: |
  source /etc/environment
  alias untar='tar -zxvf '
  alias sha='shasum -a 256 '
  alias hs='history | grep'
  alias svi='sudo vi'
  alias c='clear'
  alias ll='ls -la'
  alias l.='ls -d .* --color=auto'
  alias cd..='cd ..'
  alias ..='cd ..'
  alias ...='cd ../../../'
  alias ....='cd ../../../../'
  alias .....='cd ../../../../'
  alias grep='grep --color=auto'
  alias h='history'
  alias path='echo -e ${PATH//:/\\n}'
  alias ols="ls -la --color | awk '{k=0;for(i=0;i<=8;i++)k+=((substr(\$1,i+2,1)~/[rwx]/)*2^(8-i));if(k)printf(\" %0o \",k);print}'"

machine_path: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

machine_hostname: template