---
- name: "({{ task_filename }}) block for become=true"
  become: true
  block:
    - name: "({{ task_filename }}) stat key.env"
      ansible.builtin.stat:
        path: "{{ app_path }}/key.env"
      register: register_key_exists

    - name: "({{ task_filename }}) generate encryption key"
      ansible.builtin.shell: head -c32 /dev/urandom | base64
      changed_when: false
      register: register_key_created
      when: not register_key_exists.stat.exists

    - name: "({{ task_filename }}) Create key.env"
      ansible.builtin.copy:
        dest: "{{ app_path }}/key.env"
        mode: "0600"
        content: |
          # key for encrypting access keys in database. It must be generated by using the following command:
          # head -c32 /dev/urandom | base64
          SEMAPHORE_ACCESS_KEY_ENCRYPTION={{ register_key_created.stdout }}
      when: not register_key_exists.stat.exists

    - name: "({{ task_filename }}) Template {{ app_name }} files"
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '{{ item.mode | default("0644") }}'
      loop:
        - src: .env.j2
          dest: "{{ app_path }}/.env"
          mode: "0600"
        - src: quadlet-semaphore_postgres.container.j2
          dest: /etc/containers/systemd/semaphore_postgres.container
        - src: quadlet-semaphore.container.j2
          dest: /etc/containers/systemd/semaphore.container

    - name: "({{ task_filename }}) Template {{ app_name }} network"
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '{{ item.mode | default("0644") }}'
      loop:
        - src: quadlet-semaphore_default.network.j2
          dest: /etc/containers/systemd/{{ con_semaphore_container_network_name }}.network
      when: con_semaphore_container_network_create

    - name: "({{ task_filename }}) Create a symbolic links for container services"
      ansible.builtin.file:
        src: "/etc/containers/systemd/{{ item }}"
        dest: "{{ app_path }}/quadlet-{{ item }}"
        state: link
      loop:
        - "semaphore.container"
        - "semaphore_postgres.container"
        - "{{ con_semaphore_container_network_name }}.network"

    - name: "({{ task_filename }}) start semaphore quadlet"
      ansible.builtin.systemd_service:
        state: "{{ con_semaphore_systemd_service_state }}"
        daemon_reload: true
        name: semaphore

    - name: "({{ task_filename }}) Ensure Application is started and accepting connections"
      ansible.builtin.uri:
        url: "{{ con_semaphore_url }}"
        return_content: true
        status_code: 200, 403
        follow_redirects: all
        timeout: 5
        validate_certs: "{{ http.ssl_verify }}"
      register: healthcheck
      until: healthcheck.status is defined and (healthcheck.status == 200 or healthcheck.status == 403)
      retries: "{{ http.retries }}"
      delay: "{{ http.delay }}"
